name: Activity card

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render assets/activity-*.svg from the GitHub GraphQL API
        run: node scripts/activity.mjs
        env:
          # ACTIVITY_TOKEN: a fine-grained PAT with read access to the private repos, so the
          # language split covers everything. Without it the Actions token is used and the
          # split covers public repos only; the contribution numbers are identical either way.
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit when the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg data/activity.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh activity card"
            git push
          fi
