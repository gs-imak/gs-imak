name: Activity card

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render assets/activity-*.svg from the GitHub GraphQL API
        run: node scripts/activity.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Actions token sees public repos only, so the language split is kept from the last
          # local run (node scripts/activity.mjs with gh logged in) instead of being recomputed.
          KEEP_LANGUAGES: "1"

      - name: Commit when the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg data/activity.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh activity card"
            git push
          fi
